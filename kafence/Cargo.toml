[package]
name = "kafence"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
kafka = "0.9"
rdkafka = { version = "0.39", features = ["cmake-build"] }
rocksdb = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1.24.0", features = ["v4"] }

hyper = { version = "0.14", features = ["full"] }
mini-redis = "0.4"
rand = "0.8.5"
tonic = "0.9"
prost = "0.11"